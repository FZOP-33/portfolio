<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="MD — Mohamed Diarra Monogram">
  <defs>
    <!-- Primary Violet-to-Blue Brand Gradient -->
    <linearGradient id="md-bg-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="52%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Subtle Top-Left Specular Sheen -->
    <linearGradient id="md-sheen" x1="8" y1="6" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Rim Border Gradient -->
    <linearGradient id="md-rim" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#DDD6FE" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.6" />
    </linearGradient>

    <!-- D-Curve Subtle Ice-Blue Tint -->
    <linearGradient id="md-d-stroke" x1="35" y1="20" x2="51" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Emblem Base -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#md-bg-grad)" />
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#md-sheen)" />
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="15.25" stroke="url(#md-rim)" stroke-width="1.5" />

  <!-- Inner Architectural Frame Accent -->
  <rect x="8" y="8" width="48" height="48" rx="11.5" fill="#090D16" fill-opacity="0.16" />

  <!-- Centered Geometric Minimalist "M" -->
  <path
    d="M13.8 43.5V20.5L22.4 32L31 20.5V43.5"
    stroke="#FFFFFF"
    stroke-width="4.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Centered Geometric Minimalist "D" -->
  <path
    d="M37.4 20.5H41.9C47.1 20.5 50.2 24.9 50.2 32C50.2 39.1 47.1 43.5 41.9 43.5H37.4V20.5Z"
    stroke="url(#md-d-stroke)"
    stroke-width="4.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Precision Cyan Signal Node (Top-Right Accent) -->
  <circle cx="51" cy="13.5" r="2.5" fill="#67E8F9" />
</svg>
